name: FindRef explicit opt-in validation

on:
  push:
    branches: [codex/ci-findref-opt-in-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Generate tracked settings files
        run: |
          dart run tool/generate_search_index.dart
          dart run tool/generate_settings_l10n.dart
      - name: Prove the previous native-only regressions
        run: |
          git apply ci/findref-opt-in-tests.patch
          set +e
          flutter test --no-pub --reporter expanded test/find_ref/find_ref_dialog_view_test.dart --name 'native-only without reference opt-in' > before.log 2>&1
          result=$?
          set -e
          cat before.log
          test "$result" -ne 0
          grep -F 'Expected: no matching candidates' before.log
          grep -F 'אוצריא' before.log
      - name: Reproduce the personal refresh cancellation regression
        run: |
          set +e
          flutter test --no-pub --reporter expanded test/find_ref/find_ref_personal_books_refresh_test.dart --name 'reusing non-personal results cancels a personal refresh in debounce' > personal-before.log 2>&1
          result=$?
          set -e
          cat personal-before.log
          test "$result" -ne 0
          grep -F 'Expected: FindRefSuccess' personal-before.log
          grep -F 'Actual: FindRefSuccess' personal-before.log
      - name: Apply the opt-in-only implementation
        run: |
          git apply ci/findref-opt-in-implementation.patch
          dart format lib/find_ref/bloc/find_ref_bloc.dart lib/find_ref/view/find_ref_dialog.dart test/find_ref/find_ref_dialog_view_test.dart
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          base = 'cffc03f94a8d5b64225ab562da13c3127cc5e828'
          original = subprocess.check_output(['git','show',base+':lib/find_ref/view/find_ref_dialog.dart'], text=True)
          current = Path('lib/find_ref/view/find_ref_dialog.dart').read_text()
          def tile(source):
              start = source.index('  Widget _buildResultTile(')
              return source[start:source.index('\n  }\n', start)+5]
          assert tile(original) == tile(current)
          assert Path('windows/CMakeLists.txt').read_text() == subprocess.check_output(['git','show',base+':windows/CMakeLists.txt'], text=True)
          Path('native-mode-proof.json').write_text(json.dumps({'nativeTileMatchesDevExactly':True,'windowsCmakeMatchesDevExactly':True}))
          PY
      - name: Verify original and opted-in provider contracts
        run: |
          set -o pipefail
          flutter test --no-pub --concurrency=1 --reporter expanded test/find_ref/ test/plugins/services/plugin_library_books_registry_test.dart test/plugins/services/plugin_extended_validator_startup_test.dart test/plugins/models/plugin_api_catalog_test.dart test/plugins/bridge/plugin_bridge_adapter_test.dart test/design_system/ui_lint_test.dart 2>&1 | tee after.log
      - name: Analyze the narrowed source
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee analyze.log
          dart run tool/plugins/generate_plugin_spec.dart --check
          dart tool/ui_lint_cli.dart --format=json > ui-lint.json
          python3 - <<'PY'
          import json
          data = json.load(open('ui-lint.json'))
          assert not data['new'] and not data['problems'] and not data['dead_baseline']
          PY
      - name: Export the verified patch
        run: git diff --binary fc597da66522833227e24cfdea084bcd4a7bcde3 -- docs/plugin-sdk/FIND_REF.md lib/find_ref/bloc/find_ref_bloc.dart lib/find_ref/view/find_ref_dialog.dart test/find_ref/find_ref_dialog_view_test.dart windows/CMakeLists.txt > validated-narrow.patch
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: validated-findref-opt-in
          path: |
            before.log
            personal-before.log
            after.log
            analyze.log
            ui-lint.json
            native-mode-proof.json
            validated-narrow.patch
